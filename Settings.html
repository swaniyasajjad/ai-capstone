<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="Settings.css">
</head>
<body>

  <main class="settings-wrapper">
    <section class="settings-card" aria-labelledby="settingsTitle">
      <h1 id="settingsTitle">Settings</h1>

      <!-- noValidate lets us fully control validation with JavaScript -->
      <form id="settingsForm" novalidate>

        <!-- Full Name -->
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            aria-describedby="fullNameError"
            aria-invalid="false"
          >
          <span class="error-message" id="fullNameError" role="alert"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            aria-describedby="emailError"
            aria-invalid="false"
          >
          <span class="error-message" id="emailError" role="alert"></span>
        </div>

        <!-- Theme -->
        <div class="form-group">
          <label for="theme">Theme</label>
          <select id="theme" name="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <!-- Submit -->
        <button type="submit" class="save-btn">Save Settings</button>

        <!-- Success message, announced politely to screen readers -->
        <p class="success-message" id="successMessage" role="status" aria-live="polite"></p>

      </form>
    </section>
  </main>

  <script src="Settings.js"></script>
</body>
</html>
